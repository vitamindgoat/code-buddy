<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bump BUILD whenever css/js/assets change: the ?v= below makes every
       deploy a brand-new URL, so no browser or CDN cache can serve old files. -->
  <meta name="build" content="9" />
  <title>CodeBuddy – Learn to code with a friend</title>

  <!-- Font: Nunito is rounded and friendly, good for a kid-facing app -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- CodeMirror 5: the code editor library (styles + core + Python mode).
       Shipped in vendor/ so the app has no outside dependency at runtime. -->
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css" />
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/python.js"></script>

  <link rel="stylesheet" href="styles.css?v=9" />
  <link rel="stylesheet" href="buddy.css?v=9" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">CodeBuddy</span>
    </div>
    <div class="topbar-right">
      <span class="pill" id="lesson-pill">Lesson 1</span>
      <button id="voice-btn" class="btn btn-ghost btn-icon-only" type="button" title="Read the buddy's messages out loud" aria-pressed="false">🔇 Voice off</button>
    </div>
  </header>

  <main class="layout">

    <!-- LEFT: the lesson -->
    <section class="card lesson">
      <div class="progress">
        <span id="progress-label">Lesson 1 of 3</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
      <h1 class="lesson-title" id="lesson-title"></h1>
      <p class="lesson-text" id="lesson-intro"></p>
      <ol class="steps" id="steps"></ol>
      <div class="lesson-nav">
        <button id="prev-btn" class="btn btn-ghost" type="button">◀ Back</button>
        <button id="next-btn" class="btn btn-primary" type="button" disabled>Next lesson ▶</button>
      </div>
      <div id="buddy-debug" class="buddy-debug" hidden></div>
    </section>

    <!-- RIGHT: editor (with the buddy floating inside it) + output -->
    <section class="workspace">
      <div class="card editor-card">
        <div class="card-header">
          <span class="card-label">Your code</span>
          <div class="actions">
            <button id="reset-btn" class="btn btn-ghost" type="button">Start over</button>
            <button id="run-btn" class="btn btn-primary" type="button" disabled>
              <span class="btn-icon">▶</span> Run
            </button>
          </div>
        </div>

        <div class="editor-wrap">
          <!-- CodeMirror replaces this textarea with a real editor. It starts
               EMPTY: the learner types every line themselves. -->
          <textarea id="code" spellcheck="false"></textarea>

          <!-- The buddy floats here, level with the line being typed -->
          <div id="buddy-float" class="buddy-float">
            <div class="speech" id="speech" title="Click to skip ahead"></div>
            <div id="buddy"></div>
          </div>
        </div>
      </div>

      <div class="card output-card">
        <div class="card-header">
          <span class="card-label">Output</span>
          <span id="status" class="status"></span>
        </div>
        <pre id="output" class="output"><span class="output-hint">Press Run to see what your code does.</span></pre>
      </div>
    </section>

  </main>

  <script src="fx.js?v=9"></script>
  <script src="lessons.js?v=9"></script>
  <script src="buddy.js?v=9"></script>
  <script src="tutor.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
